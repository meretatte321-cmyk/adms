    function switchTab(e) {

    async function searchAttendance() {
      const dateInput = document.getElementById('dateInput').value;
      if (!dateInput) return;

      showLoading(true);
      
      try {
        const logs = await fetchDeviceLogs(dateInput);
        const attendanceData = processAttendanceLogs(logs, dateInput);
        displayResults(attendanceData, dateInput);
      } catch (error) {
        console.error('Error fetching attendance:', error);
        showError('Failed to fetch attendance data. Please check your connection and try again.');
      } finally {
        showLoading(false);
      }
    }

    async function fetchDeviceLogs(date) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ date })
      });

      if (!response.ok) {
        throw new Error('Network response was not ok');
      }

      const xmlText = await response.text();
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
      
      const resultNode = xmlDoc.getElementsByTagName('GetDeviceLogsResult')[0];
      if (!resultNode) {
        throw new Error('Invalid response format');
      }

      return resultNode.textContent;
    }

    // In the processAttendanceLogs function, store the original timestamp strings:
function processAttendanceLogs(logsText, date) {
  if (!logsText || logsText.trim() === '') {
    return [];
  }

  const lines = logsText.trim().split('\n').filter(line => line.trim());
  const employeeLogs = {};

  // Parse each log entry
  lines.forEach(line => {
    const parts = line.split(',');
    if (parts.length < 5) return;

    const timestamp = parts[0].trim();
    const empCode = parts[1].trim();
    
    if (!employeeLogs[empCode]) {
      employeeLogs[empCode] = [];
    }
    // Store the original timestamp string, not a Date object
    employeeLogs[empCode].push(timestamp);
  });

  // Calculate attendance for each employee
  const attendanceRecords = [];
  
  for (const [empCode, timestamps] of Object.entries(employeeLogs)) {
    // Convert to Date objects only for sorting and calculation
    const timestampDates = timestamps.map(ts => new Date(ts));
    timestampDates.sort((a, b) => a - b);
    
    const firstPunch = timestampDates[0];
    const lastPunch = timestampDates[timestampDates.length - 1];
    const durationMs = lastPunch - firstPunch;
    const durationMinutes = Math.floor(durationMs / 60000);
    const durationHours = durationMinutes / 60;

    let status;
    if (durationHours >= 6) {
      status = 'PRESENT';
    } else if (durationHours > 0) {
      status = 'SHORT';
    } else {
      status = 'ABSENT';
    }

    attendanceRecords.push({
      pin: empCode,
      name: EMPLOYEES[empCode] || 'Unknown',
      // Store ISO strings instead of Date objects
      first_ts: firstPunch.toISOString(),
      last_ts: lastPunch.toISOString(),
      duration_minutes: durationMinutes,
      status: status
    });
  }

  return attendanceRecords;
}

    function createTableRow(record) {
      const statusColors = {
        'PRESENT': 'bg-green-100 text-green-800',
        'SHORT': 'bg-yellow-100 text-yellow-800',
        'ABSENT': 'bg-red-100 text-red-800'
      };

      const duration = formatDuration(record.duration_minutes);
      const firstPunch = record.first_ts ? formatTime(record.first_ts) : '-';
      const lastPunch = record.last_ts ? formatTime(record.last_ts) : '-';

      return `
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${record.pin}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${record.name}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${firstPunch}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${lastPunch}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${duration}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${statusColors[record.status] || 'bg-gray-100 text-gray-800'}">
              ${record.status}
            </span>
          </td>
        </tr>
      `;
    }

    function formatDuration(minutes) {
      if (!minutes || minutes === 0) return '0h 0m';
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;
      return `${hours}h ${mins}m`;
    }

    function formatTime(timestamp) {
      if (!timestamp) return '-';
      
      // Parse ISO string directly to avoid timezone issues
      // ISO format: YYYY-MM-DDTHH:MM:SS.sssZ
      if (typeof timestamp === 'string') {
        // Extract time part from ISO string (HH:MM:SS)
        const timePart = timestamp.split('T')[1]; // Get "HH:MM:SS.sssZ"
        const [hours, minutes, secondsWithMs] = timePart.split(':');
        const seconds = Math.floor(parseFloat(secondsWithMs));
        
        const hour = parseInt(hours);
        const period = hour >= 12 ? 'PM' : 'AM';
        const displayHours = hour % 12 || 12;
        
        return `${String(displayHours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')} ${period}`;
      }
      
      // Fallback for Date objects
      const date = new Date(timestamp);
      const hours = date.getHours();
      const minutes = date.getMinutes();
      const seconds = date.getSeconds();
      
      const period = hours >= 12 ? 'PM' : 'AM';
      const displayHours = hours % 12 || 12;
      
      return `${String(displayHours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')} ${period}`;
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
      });
    }

        const [year, month] = monthInput.split('-');
        displayMonthlyResults(employees, year, month);
      } catch (error) {
        console.error('Error fetching employees:', error);
        showMonthlyError('Failed to fetch employee list. Please check your connection and try again.');
      } finally {
        showMonthlyLoading(false);

      const calendarContainer = document.getElementById('calendarContainer');
      
      // Show loading state
      modalEmployeeName.textContent = 'Loading...';
      modalEmployeeCode.textContent = 'Fetching attendance data...';
      calendarContainer.innerHTML = `
        <div class="col-span-7 text-center py-12">
          <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
          <p class="mt-4 text-gray-600">Loading attendance data...</p>
        </div>
      `;
      modal.classList.remove('hidden');
      
      // Fetch attendance data for this employee
      fetchEmployeeAttendanceData(empCode, yearMonth);
    }

    async function fetchEmployeeAttendanceData(empCode, yearMonth) {
      try {
        const response = await fetch('/api/employee-attendance', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ empCode, yearMonth })
        });

        if (!response.ok) {
          throw new Error('Failed to fetch employee attendance');
        }

        const employeeData = await response.json();
        displayEmployeeDetailModal(employeeData, yearMonth);
      } catch (error) {
        console.error('Error fetching employee attendance:', error);
        
        const calendarContainer = document.getElementById('calendarContainer');
        calendarContainer.innerHTML = `
          <div class="col-span-7 text-center py-12 text-red-600">
            <svg class="mx-auto h-12 w-12 text-red-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-lg font-medium">Failed to load attendance data</p>
            <p class="text-sm mt-2">Please try again</p>
          </div>
        `;
      }
    }

    function displayEmployeeDetailModal(employeeData, yearMonth) {
      const modalEmployeeName = document.getElementById('modalEmployeeName');
      const modalEmployeeCode = document.getElementById('modalEmployeeCode');
      const calendarContainer = document.getElementById('calendarContainer');
      
      modalEmployeeName.textContent = employeeData.name;
      
      // Generate calendar view
      const [year, month] = yearMonth.split('-');
      const daysInMonth = new Date(year, month, 0).getDate();
      
      // Get month name
      const monthName = new Date(year, month - 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      modalEmployeeCode.textContent = `${employeeData.pin} • ${monthName}`;
      
      // Create day headers
      const dayHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      let calendarHTML = dayHeaders.map(day => 
        `<div class="text-center font-semibold text-gray-700 bg-gray-200 p-2 rounded">${day}</div>`
      ).join('');
      
      // Get first day of month
      const firstDay = new Date(year, month - 1, 1).getDay();
      
      // Add empty cells for days before month starts
      for (let i = 0; i < firstDay; i++) {
        calendarHTML += '<div class="p-2 bg-gray-50 rounded"></div>';
      }
      
      // Add day cells
      for (let day = 1; day <= daysInMonth; day++) {
        const date = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const record = employeeData.dailyRecords[date];
        
        let cellHTML = `<div class="p-2 bg-white border rounded cursor-pointer hover:shadow-md transition">`;
        cellHTML += `<div class="text-center font-semibold text-gray-900 mb-1">${day}</div>`;
        
        if (record) {
          const statusColors = {
            'PRESENT': { bg: 'bg-green-100', text: 'text-green-800', label: '✓' },
            'SHORT': { bg: 'bg-yellow-100', text: 'text-yellow-800', label: '⚠' },
            'ABSENT': { bg: 'bg-red-100', text: 'text-red-800', label: '✗' }
          };
          
          const colors = statusColors[record.status] || statusColors['ABSENT'];
          const duration = formatDuration(record.duration_minutes);
          
          // Check if first punch and last punch are the same (possibly missed punch)
          const firstTime = formatTime(record.first_ts);
          const lastTime = formatTime(record.last_ts);
          const isMissingPunch = firstTime === lastTime;
          
          cellHTML += `
            <div class="${colors.bg} ${colors.text} text-xs p-1 rounded text-center font-semibold mb-1">
              ${record.status}
            </div>
            ${isMissingPunch ? '<div class="text-xs text-red-600 text-center bg-red-50 p-1 rounded mb-1 font-semibold">⚠ Possibly Missed Punch</div>' : ''}
            <div class="text-xs text-gray-600 text-center">
              IN: ${firstTime || '-'}
            </div>
            <div class="text-xs text-gray-600 text-center">
              OUT: ${lastTime || '-'}
            </div>
            <div class="text-xs text-gray-600 text-center border-t pt-1 mt-1">
              ${duration}
            </div>
          `;
        } else {
          cellHTML += `<div class="text-xs text-gray-400 text-center">No data</div>`;
        }
        
        cellHTML += `</div>`;
        calendarHTML += cellHTML;
      }
      
      calendarContainer.innerHTML = calendarHTML;
    }

    function closeEmployeeDetailModal() {
      document.getElementById('employeeDetailModal').classList.add('hidden');
      currentSelectedEmployee = null;
    }

    function showMonthlyLoading(show) {
      const loadingSection = document.getElementById('monthlyLoadingSection');
      const resultsSection = document.getElementById('monthlyResultsSection');
      
      if (show) {
        loadingSection.classList.remove('hidden');
        resultsSection.classList.add('hidden');
      } else {
        loadingSection.classList.add('hidden');
      }
    }

    function showMonthlyError(message) {
      const resultsSection = document.getElementById('monthlyResultsSection');
      const employeeTableBody = document.getElementById('monthlyEmployeeTableBody');
      
      resultsSection.classList.remove('hidden');
      employeeTableBody.innerHTML = `
        <tr>
          <td colspan="7" class="px-6 py-8 text-center">
            <div class="text-red-500">
              <svg class="mx-auto h-12 w-12 text-red-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <p class="text-lg font-medium">${message}</p>
            </div>
          </td>
        </tr>
      `;
    }
  </script>
</body>
</html>
